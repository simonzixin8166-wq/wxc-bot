name: youtube-historical-learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "youtube_learning_archive.py"
      - "youtube_provider_health.py"
      - "transcript_router.py"
      - "tests/test_youtube_learning_archive.py"
      - "state/youtube_historical_backlog.json"
      - ".github/workflows/youtube-historical-learning.yml"
  schedule:
    # Static historical videos need low-frequency retries, not daily polling.
    - cron: "20 3 * * 0"

permissions:
  contents: write

concurrency:
  # All workflows that write shared research state serialize through one group.
  # This prevents rebase conflicts between forward, historical and post-close collectors.
  group: wxc-research-writer
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate historical learning
        run: |
          python -m py_compile transcript_router.py youtube_provider_health.py youtube_learning_archive.py
          PYTHONPATH=. python tests/test_transcript_router.py
          PYTHONPATH=. python tests/test_youtube_learning_archive.py
          PYTHONPATH=. python tests/test_source_intake_completeness.py

      - name: Build non-gating historical archive once
        env:
          DATA_DIR: state
        run: timeout 8m python youtube_learning_archive.py

      - name: Build unified source intake completeness
        run: python source_intake_completeness.py

      - name: Save historical archive and provider health
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          git add state/source_intake_completeness.json state/youtube_provider_health.json state/youtube_learning_archive.json
          git diff --cached --quiet || (git commit -m "update non-gating historical youtube learning" && git pull --rebase origin main && git push origin HEAD:main)
