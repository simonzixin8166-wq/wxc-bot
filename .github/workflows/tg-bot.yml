name: tg-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟检查一次 Telegram 指令(GitHub 可能延迟几分钟)
  workflow_dispatch:         # 也可以在 Actions 页面手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: tg-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate collector code
        run: |
          python -m py_compile wxc_actions.py wxc_scraper.py wxc_tg_agent.py wxc_tg_bot.py wxc_blog.py
          PYTHONPATH=. python tests/test_blog_collector.py

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_DIR: state
          JOBS_DIR: /tmp/jobs
          WATCH_MINUTES: "30"
        run: python wxc_actions.py

      - name: Save state
        if: always()
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update state" && git push)
