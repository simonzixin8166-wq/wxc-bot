name: tg-bot

on:
  schedule:
    - cron: "*/30 * * * *"  # 触发很不准（实测约 8%），所以每次运行连续值守 4.5 小时（Owner 2026-11-11）；同一时间只跑一个
  workflow_dispatch:         # 也可以在 Actions 页面手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: tg-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # public repo: standard runners are free; a job may run up to 6 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate collector code
        run: |
          python -m py_compile wxc_access_policy.py wxc_actions.py wxc_scraper.py wxc_tg_agent.py wxc_tg_bot.py wxc_blog.py owner_forward.py
          PYTHONPATH=. python tests/test_blog_collector.py
          PYTHONPATH=. python tests/test_free_first_forward_gate.py
          PYTHONPATH=. python tests/test_owner_forward.py
          PYTHONPATH=. python tests/test_wxc_access_pause.py

      - name: Git identity for mid-run state saves
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          git config merge.request-ledger.driver "python merge_request_ledger.py %O %A %B"

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEXTPACK_TOKEN: ${{ secrets.TEXTPACK_TOKEN }}  # fine-grained, only the private textpack repo (Owner 11/6)
          TEXTPACK_REPO: simonzixin8166-wq/myalpha-s2-textpack
          USE_ANTHROPIC_INTENT: "0"  # 免费优先；如明确需要自然语言解析再手动启用
          DATA_DIR: state
          JOBS_DIR: /tmp/jobs
          WATCH_MINUTES: "30"
          BOT_RUN_MINUTES: "270"   # long-poll Telegram for 4.5 h; replies within ~1 min
          BOT_COMMIT_STATE: "1"    # push state/ right after a message is handled
        run: python wxc_actions.py

      - name: Save state
        if: always()
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          # tg-bot is notification-only: never stage the canonical research feed.
          git config merge.request-ledger.driver "python merge_request_ledger.py %O %A %B"
          git add state ':!state/research_feed.json' ':!state/research_feed_manifest.json'
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort 2>/dev/null || true
              sleep $((i*5))
            done
          fi
