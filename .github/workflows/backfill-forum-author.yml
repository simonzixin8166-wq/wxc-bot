name: backfill-forum-author

# Manual: recent-history backfill for one watched forum author (never Genuine Forward).
# The author must already be in state/watch.json (exact username match in forum listings).
on:
  workflow_dispatch:
    inputs:
      author:
        description: "Watched forum author (exact username)"
        required: true
      days:
        description: "Days back (max 92)"
        required: false
        default: "92"
      board:
        description: "Forum board (cfzh default; e.g. tzlc for 麻你)"
        required: false
        default: "cfzh"
      max_pages:
        description: "Max listing pages to scan"
        required: false
        default: "400"

permissions:
  contents: write

concurrency:
  group: wxc-research-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate
        env:
          AUTHOR: ${{ inputs.author }}
          DAYS: ${{ inputs.days }}
          BOARD: ${{ inputs.board }}
        run: |
          python -m py_compile forum_board_scan.py backfill_forum_author.py research_feed.py author_actions.py claim_extractor.py
          PYTHONPATH=. python tests/test_research_feed.py
          PYTHONPATH=. python tests/test_author_actions.py
          python - <<'PY'
          import json, os, sys
          a = os.environ["AUTHOR"]; d = int(os.environ["DAYS"]); b = os.environ.get("BOARD") or "cfzh"
          watched = a in json.load(open("state/watch.json", encoding="utf-8")) if b == "cfzh" else \
              any(x.get("author") == a and x.get("board") == b for x in json.load(open("state/board_authors.json", encoding="utf-8")))
          if not watched: sys.exit(f"{a} is not a watched author on board {b}")
          if not 1 <= d <= 92: sys.exit("days must be 1..92")
          PY
      - name: Backfill
        env:
          DATA_DIR: state
          PYTHONUNBUFFERED: "1"
          AUTHOR: ${{ inputs.author }}
          DAYS: ${{ inputs.days }}
          PAGES: ${{ inputs.max_pages }}
          BOARD: ${{ inputs.board }}
        run: |
          out=$(python backfill_forum_author.py --author "$AUTHOR" --days "$DAYS" --max-pages "$PAGES" --board "$BOARD" | tail -3)
          echo "$out"
          echo "::notice title=Forum author backfill::$(echo "$out" | tr '\n' ' ')"
      - name: Blog backfill for the same author (if a blog profile exists)
        env:
          DATA_DIR: state
          AUTHOR: ${{ inputs.author }}
          DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import json, os, research_feed as rf, wxc_blog as wb
          a = os.environ["AUTHOR"]
          if wb.resolve_profile(a):
              rows = rf.capture_blog_profile(a, days=int(os.environ["DAYS"]))
              print(f"::notice title=Blog backfill::{a} blog rows captured={len(rows or [])} (first scan = backfill provenance)")
          PY
      - name: Save source feed and seen state (conflict-safe, retried)
        env:
          AUTHOR: ${{ inputs.author }}
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          git fetch -q origin main
          python feed_safe_commit.py export --out /tmp/backfill_export.json --seen "state/seen_${AUTHOR}.json" "state/seen_forum_entries_*_${AUTHOR}.json" "state/seen_blog_*.json"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python feed_safe_commit.py apply --in /tmp/backfill_export.json
            git add state/research_feed.json state/research_feed_manifest.json state/seen_*.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
            git commit -q -m "backfill forum author ${AUTHOR} (backfill only)"
            if python verify_research_feed.py && git push origin HEAD:main; then echo "::notice title=Backfill saved::attempt ${attempt}"; exit 0; fi
            sleep $((attempt * 20))
          done
          echo "::error title=Backfill save::failed after 3 attempts (rows kept in /tmp only)"; exit 1
