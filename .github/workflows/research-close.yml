name: research-close
# Research-close contract refresh: 2026-10-08T03:00Z forum-entry-completeness

on:
  push:
    branches: [main]
    paths:
      - "youtube_research.py"
      - "transcript_router.py"
      - "research_feed.py"
      - "daily_close_research.py"
      - "wxc_scraper.py"
      - "wxc_tg_agent.py"
      - "tests/test_forum_entry_capture.py"
      - "tests/test_forum_anchor_continuity.py"
      - "wxc_blog.py"
      - "tests/test_blog_collector.py"
      - "tests/test_research_feed.py"
      - "tests/test_free_first_forward_gate.py"
      - "requirements.txt"
      - ".github/workflows/research-close.yml"
  schedule:
    # 22:30 UTC is safely after the regular US close in both DST and winter time.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wxc-research-writer
  # Collector logic/state is monotonic but version-sensitive. A newer collector
  # revision must supersede an older in-flight run so stale logic cannot write
  # state after a correctness fix.
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate source intelligence
        run: |
          python -m py_compile research_feed.py transcript_router.py youtube_research.py youtube_provider_health.py daily_close_research.py wxc_tg_agent.py wxc_blog.py wxc_scraper.py
          PYTHONPATH=. python tests/test_research_feed.py
          PYTHONPATH=. python tests/test_forum_entry_capture.py
          PYTHONPATH=. python tests/test_forum_anchor_continuity.py
          PYTHONPATH=. python tests/test_youtube_research.py
          PYTHONPATH=. python tests/test_transcript_router.py
          PYTHONPATH=. python tests/test_youtube_learning_archive.py
          PYTHONPATH=. python tests/test_free_first_forward_gate.py

      - name: Collect post-close research sources
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_DIR: state
          JOBS_DIR: /tmp/jobs
          WATCH_MINUTES: "30"
          FORUM_DAILY_PAGES: "8"
          TRANSCRIPT_FAST_MODE: "1"
        run: python daily_close_research.py

      - name: Save forward research state first
        if: always()
        run: |
          git config user.name "wxc-bot"
          git config user.email "wxc-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update forward research source feed" && git pull --rebase origin main && git push origin HEAD:main)

