name: gemini-claims-dev

# S2 challenger (Owner: Gemini text understanding, free tier, public content only). Manual only. Runs the Gemini
# claim labeller on the S2 v5 DEV set and scores it against Claude's dev labels. Shadow: writes no feed or
# production artifact; the report (labels and counts only, no source text) is an artifact.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gemini-claims-dev
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=. python tests/test_gemini_claims.py
      - name: Label the dev set with Gemini (free tier)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEXTPACK_TOKEN: ${{ secrets.TEXTPACK_TOKEN }}
          TEXTPACK_REPO: simonzixin8166-wq/myalpha-s2-textpack
          DATA_DIR: /tmp/gemini_state
        run: python gemini_claims.py --set dev --out diagnostics/gemini_claims_dev.json
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "diagnostics/gemini_claims_dev.json"
          if not os.path.exists(p):
              print("no report"); raise SystemExit
          d = json.load(open(p))
          print("## Gemini claims challenger · v5 dev set\n")
          print(f"- items {d['items']}, answered {d['answered']}, meta `{json.dumps(d['meta'])}`")
          print(f"- score vs Claude dev labels (post x ticker): `{json.dumps(d['score_vs_claude_dev'])}`")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-claims-dev
          path: diagnostics/gemini_claims_dev.json
          retention-days: 30
