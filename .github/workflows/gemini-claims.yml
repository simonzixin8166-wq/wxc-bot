name: gemini-claims

# S2 challenger (Owner: Gemini text understanding, free tier, public content only). Labels the S2 v5
# dev or frozen test set with Gemini and scores it against the gold labels. The free tier allows only a few calls a
# day, so each run resumes from the newest earlier report of the same set (its artifact) and labels only the posts
# still missing. Shadow: writes no feed or production artifact; the report holds labels and counts, no source text.
# Quota window (Owner 2026-11-16, "调整两者的运行时间，错开额度"): the free-tier quota resets at 00:00 Pacific
# (08:00 UTC). A scheduled run at 08:05 UTC labels first; youtube-forward-intake makes no Gemini video calls from
# 08:00 to 12:00 UTC. A scheduled run continues the first unfinished frozen test set (test, then forum_test) and
# does nothing once both are complete.
on:
  schedule:
    - cron: "5 8 * * *"
  workflow_dispatch:
    inputs:
      set:
        description: "dev, test (frozen gold v5, measured once), forum_dev (forum dev gold v1, batched) or forum_test (frozen forum gold v1, measured once)"
        type: choice
        options: [test, dev, forum_dev, forum_test]
        default: test

permissions:
  contents: read
  actions: read   # only to download the previous report artifact of this workflow

concurrency:
  group: gemini-claims
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INPUT_SET: ${{ inputs.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests
        run: PYTHONPATH=. python tests/test_gemini_claims.py
      - name: Pick the set (manual input, or the first unfinished frozen test set)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_SET" ]; then echo "SET=$INPUT_SET" >> "$GITHUB_ENV"; exit 0; fi
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow gemini-claims.yml --limit 30 --json databaseId -q '.[].databaseId')
          for s in test forum_test; do
            rm -rf probe; mkdir probe; found=""
            for id in $runs; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "gemini-claims-$s" -D probe 2>/dev/null; then found=1; break; fi
            done
            if [ -z "$found" ] || ! python -c "import json,sys; sys.exit(0 if json.load(open('probe/gemini_claims_$s.json')).get('complete') else 1)"; then
              echo "SET=$s" >> "$GITHUB_ENV"; echo "next set: $s"; exit 0
            fi
          done
          echo "SET=none" >> "$GITHUB_ENV"; echo "test and forum_test are complete: nothing to do"
      - name: Fetch the previous report of this set (resume)
        if: env.SET != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow gemini-claims.yml --limit 30 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "gemini-claims-$SET" -D prev 2>/dev/null; then
              echo "resuming from run $id"; break
            fi
          done
          ls -l prev || true
      - name: Label with Gemini (free tier)
        if: env.SET != 'none'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEXTPACK_TOKEN: ${{ secrets.TEXTPACK_TOKEN }}
          TEXTPACK_REPO: simonzixin8166-wq/myalpha-s2-textpack
          DATA_DIR: /tmp/gemini_state
        run: python gemini_claims.py --set "$SET" --resume "prev/gemini_claims_$SET.json" --out "diagnostics/gemini_claims_$SET.json"
      - name: Summary
        if: always() && env.SET != 'none'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = os.environ["SET"]
          p = f"diagnostics/gemini_claims_{s}.json"
          if not os.path.exists(p):
              print("no report"); raise SystemExit
          d = json.load(open(p))
          print(f"## Gemini claims challenger · v5 {s} set\n")
          print(f"- answered {d['answered']}/{d['items']} (complete: {d['complete']}), meta `{json.dumps(d['meta'])}`")
          print(f"- score vs {d['gold']} on answered posts (post x ticker): `{json.dumps(d['score'])}`")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && env.SET != 'none'
        with:
          name: gemini-claims-${{ env.SET }}
          path: diagnostics/gemini_claims_${{ env.SET }}.json
          retention-days: 90
